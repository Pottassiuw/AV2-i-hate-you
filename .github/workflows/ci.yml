name: Validar AV2
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: greencode
          POSTGRES_PASSWORD: greencode
          POSTGRES_DB: greencode
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U greencode" --health-interval 2s
          --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cp .env.example .env
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
